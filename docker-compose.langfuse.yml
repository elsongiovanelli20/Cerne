# Langfuse self-hosted (MIT, fora de /ee) — traces, sessões, custos, avaliações e prompts de CADA chamada do gateway.
# Opcional e separado: sem este arquivo, nada muda no Cerne (o gateway continua exatamente como está).
#
#   1) gere os segredos no .env:      python scripts/langfuse-setup.py
#   2) suba junto com o Cerne:        docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d
#      (ou, no .env: COMPOSE_FILE=docker-compose.yml:docker-compose.langfuse.yml — no Windows use ";" no lugar de ":")
#   3) abra http://localhost:${LANGFUSE_PORT:-3300} e entre com LANGFUSE_INIT_USER_EMAIL / LANGFUSE_INIT_USER_PASSWORD
#      Em produção, publique pelo Caddy (ex.: langfuse.orqion-ia.com.br → localhost:3300) e ajuste LANGFUSE_PUBLIC_URL.
#
# Recursos: ~3–4 GB de RAM a mais (ClickHouse + web + worker). Imagens multi-arch (amd64 + arm64/Ampere).
# Telemetria do Langfuse DESLIGADA (soberano). Conteúdo de prompt/resposta NÃO é gravado por padrão
# (LANGFUSE_CAPTURE_CONTENT=false): chamadas ao modelo local não passam pelo mascaramento de PII, então
# ligar a captura espalha PII para o Langfuse — ligue só se aceitar isso (o banco continua no seu servidor).

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3300}
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?rode scripts/langfuse-setup.py}@langfuse-db:5432/langfuse
  SALT: ${LANGFUSE_SALT:?rode scripts/langfuse-setup.py}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?rode scripts/langfuse-setup.py}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?rode scripts/langfuse-setup.py}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?rode scripts/langfuse-setup.py}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:?rode scripts/langfuse-setup.py}

x-langfuse-deps: &langfuse-deps
  langfuse-db:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

services:
  # ---- o gateway passa a exportar traces (callback langfuse_otel do LiteLLM) ----
  gateway:
    entrypoint: ["/bin/sh", "/app/langfuse-entry.sh"]
    command: ["--port", "4000", "--num_workers", "1"]
    volumes:
      - ./gateway/langfuse-entry.sh:/app/langfuse-entry.sh:ro
    environment:
      - LITELLM_OTEL_V2=true
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?rode scripts/langfuse-setup.py}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?rode scripts/langfuse-setup.py}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - LITELLM_OTEL_LANGFUSE_SPAN_SCOPE=llm_only     # só a geração (não cada span interno do proxy)
      - LANGFUSE_CAPTURE_CONTENT=${LANGFUSE_CAPTURE_CONTENT:-false}

  # ---- o painel do Cerne mostra o status e o link do Langfuse em Observabilidade/Preflight ----
  app:
    environment:
      - LANGFUSE_URL=http://langfuse-web:3000
      - LANGFUSE_PUBLIC_URL=${LANGFUSE_PUBLIC_URL:-http://localhost:3300}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG:-4}
    container_name: cerne-langfuse-web
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?rode scripts/langfuse-setup.py}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # inicialização "headless": org, projeto, chaves do gateway e o 1º usuário já criados no 1º boot
      LANGFUSE_INIT_ORG_ID: cerne
      LANGFUSE_INIT_ORG_NAME: Cerne
      LANGFUSE_INIT_PROJECT_ID: cerne-gateway
      LANGFUSE_INIT_PROJECT_NAME: Cerne Gateway
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@cerne.local}
      LANGFUSE_INIT_USER_NAME: Admin Cerne
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?rode scripts/langfuse-setup.py}
      AUTH_DISABLE_SIGNUP: "true"
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3300}:3000"      # só local; exponha pelo Caddy com TLS
    mem_limit: 1500m
    restart: unless-stopped

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG:-4}
    container_name: cerne-langfuse-worker
    depends_on: *langfuse-deps
    environment: *langfuse-env
    mem_limit: 1g
    restart: unless-stopped

  langfuse-db:
    image: postgres:17-alpine
    container_name: cerne-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./data/langfuse/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 400m
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    container_name: cerne-langfuse-clickhouse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - ./data/langfuse/clickhouse:/var/lib/clickhouse
      - ./data/langfuse/clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 1500m
    restart: unless-stopped

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: cerne-langfuse-minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - ./data/langfuse/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
    mem_limit: 300m
    restart: unless-stopped

  langfuse-redis:
    image: redis:7-alpine
    container_name: cerne-langfuse-redis
    command: ["--requirepass", "${LANGFUSE_REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/langfuse/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_AUTH}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    mem_limit: 200m
    restart: unless-stopped
